# ==============================
# SERVER
# ==============================
server.port=${PORT:8080}

# ==============================
# DATABASE - Supabase PostgreSQL
# ==============================
# Substitua com suas credenciais do Supabase:
# Project Settings > Database > Connection String (JDBC)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?user=postgres.btiyteqfytudpbswxgzd&sslmode=require
spring.datasource.username=postgres.btiyteqfytudpbswxgzd
spring.datasource.password=${PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================
# JWT
# ==============================
# Gere uma chave forte: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==============================
# CORS
# ==============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# ==============================
# MERCADO PAGO
# ==============================
mp.access-token=${MP_ACCESS_TOKEN}

# ==============================
# Email SendGrip SMTP vai substituir quando o cliente tiver email com dominio proprio
# ==============================
# Email Gmail SMTP
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from-email=${SENDGRID_FROM_EMAIL}

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
